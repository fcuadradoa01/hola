site_name: Apuntes FP Informática
site_description: 🎓 Recursos abiertos para la Familia Profesional de Informática y Comunicaciones
site_author: Paco Cuadrado
site_url: https://fcuadradoa01.github.io/hola/
repo_url: https://github.com/fcuadradoa01/hola
repo_name: hola

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - content.code.copy
    - search.highlight
    - toc.integrate
    - content.code.annotate
    - content.tooltips
    - content.tabs.link
  palette:
    - scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Oscuro
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Claro
  font:
    text: Roboto
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - css/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

nav:
  - 🏠 Inicio: index.md

  - 🤖 IA: AI/index.md

  - 🌐 Redes: redes/index.md

  - 🐳 Docker: docker/index.md
