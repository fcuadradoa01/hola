site_name: Apuntes FP Informática
site_description: Apuntes, laboratorios y recursos para Formación Profesional y CETI
site_author: Paco Cuadrado
site_url: https://fcuadradoa01.github.io/hola/
repo_url: https://github.com/fcuadradoa01/hola
repo_name: hola

theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - content.code.copy
    - search.highlight
    - toc.integrate
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Oscuro
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Claro
  font:
    text: Roboto
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - css/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

nav:
  - 🏠 Inicio: index.md

  - 🤖 IA:
      - OpenAI: AI/OpenAI-1-el-incidente.md
      - Técnicas y Medidas: AI/OpenAI-2-tecnicas-medidas.md

  - 🌐 Redes:
      - Guía configuración de la red en Ubuntu Server: redes/guia-config-red-ubuntu.md
      - Laboratorio MikroTik Hardening: redes/lab-mikrotik-hardening.md

  - 🐳 Docker:
      - Laboratorio Wordpress: docker/lab-docker-wordpress-mariadb.md
      - Portainer: docker/lab-portainer.md
